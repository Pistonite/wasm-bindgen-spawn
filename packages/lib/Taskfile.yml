version: '3'

includes:
  cargo:
    taskfile: ../../node_modules/mono-dev/task/cargo.yaml
    internal: true
    optional: true

  dispatcher:
    taskfile: ../dispatcher
    dir: ../dispatcher
    internal: true

tasks:
  check:
    - task: cargo:clippy-all
    - task: cargo:fmt-check
  fix:
    - task: cargo:fmt-fix
  dev-doc:
    - task: dispatcher:build
    - task: cargo:watch-serve-doc

  package:
    - cargo package --list --allow-dirty

  publish:
    - cargo publish --allow-dirty


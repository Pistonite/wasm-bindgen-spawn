version: '3'

includes:
  dispatcher:
    taskfile: ../dispatcher
    dir: ../dispatcher
    internal: true


tasks:
  build:
    - task: dispatcher:build
    - mkdir -p target/wasm-pack/logs
    - task: build-cargo
      vars: { BUILD_DIR: unwind }
    - task: wasm-pack
      vars: { BUILD_DIR: unwind, BUILD_TARGET: no-modules }
    - task: wasm-pack
      vars: { BUILD_DIR: unwind, BUILD_TARGET: web }
    # - task: wasm-pack
    #   vars: { BUILD_DIR: unwind, BUILD_TARGET: nodejs }
    # - task: wasm-pack
    #   vars: { BUILD_DIR: unwind, BUILD_TARGET: deno, BUILD_ARGS: --features no-wbg-module }
    # - task: wasm-pack
    #   vars: { BUILD_DIR: unwind, BUILD_TARGET: bundler, BUILD_ARGS: --features no-wbg-module }
    # - task: build-cargo
    #   vars: { BUILD_DIR: abort }
    # - task: wasm-pack
    #   vars: { BUILD_DIR: abort, BUILD_TARGET: no-modules }
    # - task: wasm-pack
    #   vars: { BUILD_DIR: abort, BUILD_TARGET: web }
    # - task: wasm-pack
    #   vars: { BUILD_DIR: abort, BUILD_TARGET: nodejs }
    # - task: wasm-pack
    #   vars: { BUILD_DIR: abort, BUILD_TARGET: deno, BUILD_ARGS: --features no-wbg-module }
    # - task: wasm-pack
    #   vars: { BUILD_DIR: abort, BUILD_TARGET: bundler, BUILD_ARGS: --features no-wbg-module }
    # - node scripts/post-build.ts

  build-cargo:
    internal: true
    dir: 'build-{{.BUILD_DIR}}'
    cmds:
      - cargo build --release --target wasm32-unknown-unknown

  wasm-pack:
    internal: true
    dir: 'build-{{.BUILD_DIR}}'
    cmds:
      - cmd: >
          echo 'building {{.BUILD_DIR}} --target {{.BUILD_TARGET}}';
          rm -rf ../target/wasm-pack/{{.BUILD_DIR}}-{{.BUILD_TARGET}};
          wasm-pack build -t {{.BUILD_TARGET}}
          --no-gitignore --no-pack --dev
          --out-dir ../target/wasm-pack/{{.BUILD_DIR}}-{{.BUILD_TARGET}}
          --out-name example
          -- {{.BUILD_ARGS}}
          > ../target/wasm-pack/logs/{{.BUILD_DIR}}-{{.BUILD_TARGET}}.out
          2> ../target/wasm-pack/logs/{{.BUILD_DIR}}-{{.BUILD_TARGET}}.err
        silent: true

  build-harness:
    - cp target/wasm-pack/unwind-web/example.d.ts src/wasm_gen.d.ts

  clean:
    - rm -rf target build-unwind/target build-abort/target

[package]
name = "example"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"
wasm-bindgen-spawn = { path = "..", default-features = false }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
web = ["wasm-bindgen-spawn/web", "wasm-bindgen-spawn/async"]
no-modules = ["wasm-bindgen-spawn/no-modules", "wasm-bindgen-spawn/async"]

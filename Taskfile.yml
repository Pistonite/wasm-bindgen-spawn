version: '3'

includes:
  example:
    aliases: [ex]
    taskfile: ./example
    dir: ./example

  cargo:
    taskfile: ./mono-dev/task/cargo.yaml
    internal: true
    optional: true

tasks:
  setup:
    - pnpm install
    - pnpm exec playwright install chromium
    # - pnpm exec playwright install msedge
    - pnpm exec playwright install firefox
    - pnpm exec playwright install webkit

  setup-arch-linux:
    - sudo pacman -S gtk3 gtk4 libxrandr libxdamage libxcomposite alsa-lib libxslt gst-libav libavif harfbuzz-icu libmanette enchant hyphen libxml2-legacy --needed
    - yay -S icu74 playwright-webkit-flite-deps --needed

  install:
    cmds:
      - pnpm exec playwright install
      - echo "nightly" > rust-toolchain

  build:
    desc: Incrementally dev build
    cmds:
      - txtpp src/js/createDispatcher.min.js
      - cd example && pnpm run wasm

  check:
    desc: Check for issues
    cmds:
      - task: cargo:clippy-all
      - task: cargo:fmt-check

  fix:
    desc: Fix issues
    cmds:
      - task: cargo:fmt-fix
      - txtpp src -r
